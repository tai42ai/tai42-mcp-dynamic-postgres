name: release

# A single v* tag push produces two independent release artifacts: a PyPI
# package (the importable library) and a GHCR container image (the deployable
# server). The two jobs run in parallel off the same tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Builds and publishes to PyPI with an API token held as a repository
  # secret. The `pypi` environment scopes that secret to this job.
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.26"
          enable-cache: true
      - run: uv python install 3.13
      # The pushed tag (v<version>) must match the version being built, so a
      # stale pyproject.toml can never publish under the wrong tag.
      - name: Assert tag matches pyproject version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match pyproject.toml version ${PYPROJECT_VERSION}" >&2
            exit 1
          fi
      - run: uv build
      - run: uvx twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # Attestations are minted from the OIDC identity token, which token
          # auth does not issue.
          attestations: false

  # Builds the server image and pushes it to GHCR with build provenance and
  # attestations. This is a deployable server, so the release artifact is a
  # container image rather than a PyPI package.
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef # v3.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Whether this tag is a stable release, and the bare version it carries.
      # The tag equals the pyproject version, which PEP 440 writes without a
      # separator (1.2.3rc1), so a substring test for "-" would call that
      # stable; only a full match on vX.Y.Z is safe. `version` drops the leading
      # `v` so the prerelease image tag matches the `{{version}}` form the
      # stable path publishes.
      - name: Classify the tag
        id: kind
        run: |
          set -euo pipefail
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "::notice::prerelease ${GITHUB_REF_NAME}: publishing the version tag only"
          fi

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@318604b99e75e41977312d83839a89be02ca4893 # v5.9.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/tai42-mcp-dynamic-postgres
          # The exact version from the git tag, plus a moving `latest` that only
          # stable releases claim. `raw` carries the version because a PEP 440
          # prerelease (1.2.3rc1) is not valid semver for the `semver` type.
          tags: |
            type=raw,value=${{ steps.kind.outputs.version }},enable=${{ steps.kind.outputs.stable != 'true' }}
            type=semver,pattern={{version}},enable=${{ steps.kind.outputs.stable == 'true' }}
            type=raw,value=latest,enable=${{ steps.kind.outputs.stable == 'true' }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Attest build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/tai42-mcp-dynamic-postgres
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
