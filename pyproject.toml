[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tai42-mcp-dynamic-postgres"
version = "0.5.1"
description = "Schema-driven generator for safe, scoped PostgreSQL DML tools in FastMCP agent systems"
authors = [{ name = "tai42", email = "oss@tai42.ai" }]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.13"
keywords = ["postgresql", "mcp", "fastmcp", "agents", "llm", "tools", "pgvector"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.2.1",
    "psycopg[binary,pool]>=3.2.9",
    "python-dotenv>=1.1.1",
    "pydantic-settings>=2.10.1",
    "pydantic>=2.12",
    "fastmcp>=3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "pyright>=1.1.390",
    # Dev-only validators; the shipped package imports no tai42 code. The spec
    # test validates the authored tai-plugin.yml (kind: mcp-server, contract-less)
    # against PluginSpec from tai42-contract, and scans its mcp.env markers and
    # in-package docs with tai42-kit (scan_env_marker_refs, validate_docs). Each
    # range accepts every sibling minor within the current major. Installed via
    # `uv sync --extra dev` in CI.
    "tai42-contract>=9,<10",
    "tai42-kit>=3.13,<4",
]
test-integration = [
    "testcontainers[postgres]>=4.0",
]

[project.urls]
Homepage = "https://tai42.ai"
Repository = "https://github.com/tai42ai/tai42-mcp-dynamic-postgres"
Issues = "https://github.com/tai42ai/tai42-mcp-dynamic-postgres/issues"
Changelog = "https://github.com/tai42ai/tai42-mcp-dynamic-postgres/blob/main/CHANGELOG.md"

[project.entry-points.console_scripts]
tai42-mcp-dynamic-postgres = "tai42_mcp_dynamic_postgres.cli.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.package-data]
# The in-package docs tree ships in the wheel (the marketplace extracts docs from
# it) alongside the typing marker and the authored plugin spec.
tai42_mcp_dynamic_postgres = ["py.typed", "tai-plugin.yml", "docs/*", "docs/images/*"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Integration tests are opt-in (need Docker); run them with `pytest -m integration`.
addopts = "-m 'not integration'"
markers = [
    "integration: tests that require a live PostgreSQL instance (Docker)",
]

[tool.coverage.run]
source = ["tai42_mcp_dynamic_postgres"]

[tool.coverage.report]
fail_under = 97

[tool.ruff]
line-length = 120
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
# Keep the project's existing typing style (typing.Optional / List): the `UP`
# rule set is deliberately excluded so `Optional`/`List` are not rewritten.
# Everything else enforces correctness, import order, and common cleanups.
select = ["E", "W", "F", "I", "B", "C4", "SIM", "PIE", "PT", "RUF", "TID"]

[tool.ruff.lint.per-file-ignores]
# These modules embed generated-tool source as string templates; their tool
# docstrings are intentionally long single lines and must not be reflowed.
"src/tai42_mcp_dynamic_postgres/gen/builders/select_gen.py" = ["E501"]
"src/tai42_mcp_dynamic_postgres/gen/builders/select_joined_gen.py" = ["E501"]

[tool.pyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
