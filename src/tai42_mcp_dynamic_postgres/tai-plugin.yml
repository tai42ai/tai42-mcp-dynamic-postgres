spec_version: 1
namespace: tai42
name: mcp-dynamic-postgres
package: tai42-mcp-dynamic-postgres
version: 0.5.1
description: >-
  Schema-driven generator for safe, scoped PostgreSQL DML tools in FastMCP agent
  systems
license: Apache-2.0
homepage: https://tai42.ai
repository: https://github.com/tai42ai/tai42-mcp-dynamic-postgres
categories:
  - connectors
  - database
tags:
  - mcp
  - postgresql
  - database
  - sql
  - agents
  - pgvector
  - tools
permissions:
  network: true
  subprocess: false
  filesystem: true
provides:
  - kind: mcp-server
    name: mcp-dynamic-postgres
    description: >-
      Schema-driven generator for safe, scoped PostgreSQL DML tools in FastMCP
      agent systems
    mcp:
      command: uvx
      args:
        - tai42-mcp-dynamic-postgres
      env:
        PG_HOST: '!ENV ${PG_HOST:localhost}'
        PG_PORT: '!ENV ${PG_PORT:5432}'
        PG_DB: '!ENV ${PG_DB}'
        PG_USER: '!ENV ${PG_USER}'
        PG_PASSWORD: '!ENV ${PG_PASSWORD}'
